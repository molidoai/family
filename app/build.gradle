plugins { id 'com.android.application' }
android {
    namespace 'ir.molido.hamsahm'
    compileSdk 35
    defaultConfig { applicationId 'ir.molido.hamsahm'; minSdk 24; targetSdk 35; versionCode 20600; versionName '2.6.0' }
    signingConfigs {
        release {
            if (System.getenv('HAMS_KEYSTORE_PATH')) {
                storeFile file(System.getenv('HAMS_KEYSTORE_PATH'))
                storePassword System.getenv('HAMS_KEYSTORE_PASSWORD')
                keyAlias (System.getenv('HAMS_KEY_ALIAS') ?: 'hamsahm')
                keyPassword (System.getenv('HAMS_KEY_PASSWORD') ?: System.getenv('HAMS_KEYSTORE_PASSWORD'))
            }
        }
    }
    buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}
