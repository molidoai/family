name: Build Hamsahm APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm run bundle:online
      - run: git diff --exit-code -- app/src/main/assets/www/online-vendor.js
      - run: npm run check
      - run: npm test
      - run: |
          mkdir -p build/policy-tests
          javac -encoding UTF-8 -d build/policy-tests app/src/main/java/ir/molido/hamsahm/UpdatePolicy.java app/src/main/java/ir/molido/hamsahm/ReminderPolicy.java tests/UpdatePolicyTest.java tests/ReminderPolicyTest.java
          java -cp build/policy-tests ir.molido.hamsahm.UpdatePolicyTest
          java -cp build/policy-tests ir.molido.hamsahm.ReminderPolicyTest
  debug:
    if: startsWith(github.ref, 'refs/tags/') == false
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Hamsahm-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HAMS_KEYSTORE_PASSWORD: ${{ secrets.HAMS_KEYSTORE_PASSWORD }}
      HAMS_KEY_PASSWORD: ${{ secrets.HAMS_KEY_PASSWORD }}
      HAMS_KEY_ALIAS: hamsahm
      HAMS_KEYSTORE_PATH: ${{ github.workspace }}/.private/hamsahm.jks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare original signing key
        env:
          HAMS_KEYSTORE_BASE64: ${{ secrets.HAMS_KEYSTORE_BASE64 }}
        run: |
          test -n "$HAMS_KEYSTORE_BASE64" && test -n "$HAMS_KEYSTORE_PASSWORD"
          mkdir -p .private
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          p=Path(os.environ['HAMS_KEYSTORE_PATH'])
          p.write_bytes(base64.b64decode(os.environ['HAMS_KEYSTORE_BASE64'],validate=True))
          p.chmod(0o600)
          PY
      - name: Verify release tag matches APK version
        run: |
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          text=Path('app/build.gradle').read_text()
          version=re.search(r"versionName '([^']+)'",text).group(1)
          if os.environ['GITHUB_REF_NAME'] != 'v'+version:
              raise SystemExit('Release tag does not match versionName')
          PY
      - run: gradle :app:assembleRelease --no-daemon
      - name: Publish signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk Hamsahm.apk
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" Hamsahm.apk --clobber
          else
            gh release create "$GITHUB_REF_NAME" Hamsahm.apk --title "Hamsahm $GITHUB_REF_NAME" --generate-notes
          fi
      - name: Remove local key
        if: always()
        run: rm -f .private/hamsahm.jks
