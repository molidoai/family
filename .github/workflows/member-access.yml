name: Test online member access foundation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/member-access.yml'
permissions:
  contents: read
jobs:
  postgres-access:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: supabase/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: supabase
      - run: npm test
        working-directory: supabase
