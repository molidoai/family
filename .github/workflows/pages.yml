name: Publish Hamsahm website
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/src/main/assets/www/**'
      - 'scripts/build-pages.mjs'
      - 'scripts/bundle-online.mjs'
      - 'tests/pages.test.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run bundle:online
      - run: npm run check
      - run: npm test
      - run: npm run build:pages
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published application
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --max-time 20 "${PAGE_URL}" -o /tmp/hamsahm-home.html &&
               grep -q 'pages-entry.js' /tmp/hamsahm-home.html &&
               curl --fail --silent --show-error --max-time 20 "${PAGE_URL}pages-entry.js" -o /dev/null &&
               curl --fail --silent --show-error --max-time 20 "${PAGE_URL}sw.js" -o /dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo 'Published application health check failed'
          exit 1
