name: Publish Hamsahm website
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/src/main/assets/www/**'
      - 'scripts/build-pages.mjs'
      - 'scripts/bundle-online.mjs'
      - 'tests/pages.test.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run bundle:online
      - run: npm run check
      - run: npm test
      - run: npm run build:pages
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
